[project]
name = "finanzwerk-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faker>=26.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
generate-data = "generate_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
